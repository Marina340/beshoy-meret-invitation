<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" fill="none">
  <defs>
    <radialGradient id="peony" cx="42%" cy="38%" r="68%">
      <stop offset="0%"  stop-color="#FDF0E2"/>
      <stop offset="45%" stop-color="#F8D3CC"/>
      <stop offset="100%" stop-color="#E7A6A8"/>
    </radialGradient>
    <radialGradient id="peonyIn" cx="45%" cy="42%" r="60%">
      <stop offset="0%"  stop-color="#FFF8E8"/>
      <stop offset="60%" stop-color="#FBE3C8"/>
      <stop offset="100%" stop-color="#F3C6B4"/>
    </radialGradient>
    <radialGradient id="cosmos" cx="50%" cy="50%" r="62%">
      <stop offset="0%"  stop-color="#FFF3F1"/>
      <stop offset="55%" stop-color="#FBDCDC"/>
      <stop offset="100%" stop-color="#F0AFB6"/>
    </radialGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#CFE0CE"/>
      <stop offset="100%" stop-color="#9FBFA6"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"  stop-color="#D7DCE6"/>
      <stop offset="100%" stop-color="#AAB6C6"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#C9A9AC"/>
      <stop offset="100%" stop-color="#B08B92"/>
    </linearGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <g opacity=".30">

    <!-- ── stems and sprigs ─────────────────────────── -->
    <path d="M150 250 C210 235 268 205 322 150" stroke="url(#stem)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M186 300 C250 300 310 282 366 246" stroke="url(#stem)" stroke-width="1.8" stroke-linecap="round" opacity=".75"/>
    <path d="M120 176 C150 140 190 112 236 96" stroke="url(#stem)" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>

    <!-- tiny sprig leaves -->
    <g fill="#C2A7AC" opacity=".8">
      <ellipse cx="252" cy="196" rx="13" ry="6" transform="rotate(-32 252 196)"/>
      <ellipse cx="286" cy="172" rx="11" ry="5" transform="rotate(-38 286 172)"/>
      <ellipse cx="214" cy="120" rx="12" ry="5.5" transform="rotate(-24 214 120)"/>
      <ellipse cx="330" cy="238" rx="10" ry="4.5" transform="rotate(-30 330 238)"/>
    </g>

    <!-- ── leaves ───────────────────────────────────── -->
    <g>
      <path d="M196 172 C224 132 256 116 286 116 C276 154 246 182 208 190 Z" fill="url(#leafB)" opacity=".85"/>
      <path d="M170 128 C188 88 216 66 244 62 C238 100 214 130 180 144 Z" fill="url(#leafA)" opacity=".8"/>
      <path d="M236 250 C276 226 316 220 346 228 C318 262 278 278 242 270 Z" fill="url(#leafA)" opacity=".9"/>
      <path d="M214 318 C254 300 296 300 324 312 C294 342 254 352 220 340 Z" fill="url(#leafB)" opacity=".8"/>
      <path d="M96 250 C74 214 70 176 80 148 C114 172 130 210 126 246 Z" fill="url(#leafA)" opacity=".75"/>
      <path d="M112 388 C86 360 74 322 78 292 C114 312 134 348 132 384 Z" fill="url(#leafA)" opacity=".7"/>
