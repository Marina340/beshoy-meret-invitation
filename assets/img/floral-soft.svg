        <ellipse cx="0" cy="-56" rx="34" ry="46" fill="url(#peony)" opacity=".92" transform="rotate(200.0)"/>
        <ellipse cx="0" cy="-56" rx="34" ry="46" fill="url(#peony)" opacity=".92" transform="rotate(240.0)"/>
