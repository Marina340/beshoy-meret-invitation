        <ellipse cx="0" cy="-56" rx="34" ry="46" fill="url(#peony)" opacity=".92" transform="rotate(320.0)"/>
        <ellipse cx="0" cy="-40" rx="27" ry="36" fill="url(#peony)" opacity=".95" transform="rotate(22.0)"/>
