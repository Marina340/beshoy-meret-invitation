    <!-- ── buds ─────────────────────────────────────── -->
    <g>
      <ellipse cx="66" cy="330" rx="15" ry="19" fill="#F5C9C6"/>
      <ellipse cx="88" cy="352" rx="11" ry="14" fill="#F8D8D3"/>
      <ellipse cx="300" cy="286" rx="10" ry="13" fill="#F5C9C6" opacity=".9"/>
