        <ellipse cx="0" cy="-40" rx="18" ry="31" transform="rotate(153)"/>
        <ellipse cx="0" cy="-40" rx="18" ry="31" transform="rotate(204)"/>
        <ellipse cx="0" cy="-40" rx="18" ry="31" transform="rotate(255)"/>
        <ellipse cx="0" cy="-40" rx="18" ry="31" transform="rotate(306)"/>
