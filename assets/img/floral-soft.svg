      <circle r="102" fill="url(#peony)" opacity=".55"/>
        <ellipse cx="0" cy="-56" rx="34" ry="46" fill="url(#peony)" opacity=".92" transform="rotate(0.0)"/>
        <ellipse cx="0" cy="-56" rx="34" ry="46" fill="url(#peony)" opacity=".92" transform="rotate(40.0)"/>
        <ellipse cx="0" cy="-56" rx="34" ry="46" fill="url(#peony)" opacity=".92" transform="rotate(80.0)"/>
