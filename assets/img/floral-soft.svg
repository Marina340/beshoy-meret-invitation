        <ellipse cx="0" cy="-40" rx="27" ry="36" fill="url(#peony)" opacity=".95" transform="rotate(157.0)"/>
        <ellipse cx="0" cy="-40" rx="27" ry="36" fill="url(#peony)" opacity=".95" transform="rotate(202.0)"/>
        <ellipse cx="0" cy="-40" rx="27" ry="36" fill="url(#peony)" opacity=".95" transform="rotate(247.0)"/>
        <ellipse cx="0" cy="-40" rx="27" ry="36" fill="url(#peony)" opacity=".95" transform="rotate(292.0)"/>
        <ellipse cx="0" cy="-40" rx="27" ry="36" fill="url(#peony)" opacity=".95" transform="rotate(337.0)"/>
        <ellipse cx="0" cy="-27" rx="21" ry="27" fill="url(#peonyIn)" opacity=".97" transform="rotate(12.0)"/>
        <ellipse cx="0" cy="-27" rx="21" ry="27" fill="url(#peonyIn)" opacity=".97" transform="rotate(63.4)"/>
        <ellipse cx="0" cy="-27" rx="21" ry="27" fill="url(#peonyIn)" opacity=".97" transform="rotate(114.9)"/>
        <ellipse cx="0" cy="-27" rx="21" ry="27" fill="url(#peonyIn)" opacity=".97" transform="rotate(166.3)"/>
        <ellipse cx="0" cy="-27" rx="21" ry="27" fill="url(#peonyIn)" opacity=".97" transform="rotate(217.7)"/>
        <ellipse cx="0" cy="-27" rx="21" ry="27" fill="url(#peonyIn)" opacity=".97" transform="rotate(269.1)"/>
        <ellipse cx="0" cy="-27" rx="21" ry="27" fill="url(#peonyIn)" opacity=".97" transform="rotate(320.6)"/>
        <ellipse cx="0" cy="-16" rx="15" ry="19" fill="url(#peonyIn)" opacity="1" transform="rotate(30.0)"/>
        <ellipse cx="0" cy="-16" rx="15" ry="19" fill="url(#peonyIn)" opacity="1" transform="rotate(90.0)"/>
        <ellipse cx="0" cy="-16" rx="15" ry="19" fill="url(#peonyIn)" opacity="1" transform="rotate(150.0)"/>
        <ellipse cx="0" cy="-16" rx="15" ry="19" fill="url(#peonyIn)" opacity="1" transform="rotate(210.0)"/>
        <ellipse cx="0" cy="-16" rx="15" ry="19" fill="url(#peonyIn)" opacity="1" transform="rotate(270.0)"/>
        <ellipse cx="0" cy="-16" rx="15" ry="19" fill="url(#peonyIn)" opacity="1" transform="rotate(330.0)"/>
      <circle r="10" fill="#F5DFA4"/>
      <circle r="5" fill="#E9C167"/>
    </g>

    <!-- ── cosmos flower, upper right ───────────────── -->
    <g transform="translate(352 132)" filter="url(#soft)">
      <g fill="url(#cosmos)">
        <ellipse cx="0" cy="-52" rx="23" ry="40"/>
