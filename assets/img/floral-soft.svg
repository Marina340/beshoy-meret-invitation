        <ellipse cx="0" cy="-52" rx="23" ry="40" transform="rotate(90)"/>
        <ellipse cx="0" cy="-52" rx="23" ry="40" transform="rotate(135)"/>
        <ellipse cx="0" cy="-52" rx="23" ry="40" transform="rotate(180)"/>
        <ellipse cx="0" cy="-52" rx="23" ry="40" transform="rotate(225)"/>
